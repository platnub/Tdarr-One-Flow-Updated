    {
      "name": "Prep & Clean - JS Determine Clean Title Args 🧮",
      "sourceRepo": "Community",
      "pluginName": "customFunction",
      "version": "1.0.0",
      "inputsDB": {
        "code": "module.exports = async (args) => {\n  // Replicates classic Tdarr_Plugin_MC93_Migz2CleanTitle (clean_audio=true,\n  // clean_subtitles=true, clean_comments=false -- matching the deleted U-F59Ok-h node's\n  // inputsDB) folded into the ffmpegCommand builder chain instead of a standalone remux.\n  //\n  // Per-stream indices are computed over the CURRENT non-removed stream list\n  // (args.variables.ffmpegCommand.streams after reorder + image removal), so the emitted\n  // -metadata:s:<type>:<n> targets line up with the real OUTPUT stream indices. Reusing the\n  // raw ffprobe indices would clear titles on the wrong output stream once ImgRm01 has\n  // marked an image/video stream removed.\n  //\n  // The whole computation is wrapped in try/catch: this node now runs inside the shared\n  // ffmpegCommand builder chain (no dedicated resetFlowError rescue like the deleted\n  // classic U-F59Ok-h node had), so an unexpected stream/metadata shape here must degrade\n  // to \"leave titles unchanged\" rather than fail the entire remux via the retry cascade.\n  try {\n    const streams = (args.variables.ffmpegCommand.streams || []).filter((s) => !s.removed);\n    const byType = { video: [], audio: [], subtitle: [] };\n    streams.forEach((s) => {\n      if (byType[s.codec_type]) byType[s.codec_type].push(s);\n    });\n\n    const hasTitle = (s) => s && s.tags\n      && typeof s.tags.title !== \"undefined\"\n      && s.tags.title !== \"\"\n      && s.tags.title !== '\"\"';\n    // Classic only treats a title with more than 3 \".\" characters as junk metadata for\n    // audio/subtitle streams (custom_title_matching was never configured on U-F59Ok-h).\n    const junkTitle = (s) => hasTitle(s) && (String(s.tags.title).split(\".\").length - 1) > 3;\n\n    // Build the argument list as clean tokens joined by single spaces (no leading/trailing/\n    // double spaces) so ffmpegCommandCustomArguments' outputArguments.split(\" \") yields no\n    // empty argv entries, and an all-empty result stays a genuine no-op.\n    const parts = [];\n\n    // Overall container title: classic clears file.meta.Title whenever it is set.\n    // args.inputFileObj mirrors the classic `file` object, so meta.Title is the primary\n    // source; fall back to ffProbeData.format.tags.title when meta is unavailable.\n    const meta = args.inputFileObj.meta || {};\n    const fmt = (args.inputFileObj.ffProbeData && args.inputFileObj.ffProbeData.format) || {};\n    const fmtTitle = fmt.tags ? fmt.tags.title : undefined;\n    const notEmpty = (v) => typeof v !== \"undefined\" && v !== \"\" && v !== '\"\"';\n    const overallTitleSet = notEmpty(meta.Title) || notEmpty(fmtTitle);\n    if (overallTitleSet) parts.push(\"-metadata\", \"title=\");\n\n    // Video stream titles: classic clears unconditionally when a title is present.\n    byType.video.forEach((s, i) => {\n      if (hasTitle(s)) parts.push(`-metadata:s:v:${i}`, \"title=\");\n    });\n    // Audio + subtitle stream titles: classic only clears \"junk\" (>3 dot) titles.\n    byType.audio.forEach((s, i) => {\n      if (junkTitle(s)) parts.push(`-metadata:s:a:${i}`, \"title=\");\n    });\n    byType.subtitle.forEach((s, i) => {\n      if (junkTitle(s)) parts.push(`-metadata:s:s:${i}`, \"title=\");\n    });\n\n    args.variables.clean_title_args = parts.join(\" \");\n    console.log(`clean_title_args: ${args.variables.clean_title_args}`);\n  } catch (err) {\n    // Never let a title-cleaning edge case fail the whole remux/retry chain -- fall back\n    // to \"leave titles as-is\", matching the old classic node's resetFlowError behavior.\n    console.log(`CTitle01 failed, leaving titles unchanged: ${err.message}`);\n    args.variables.clean_title_args = \"\";\n  }\n\n  return {\n    outputFileObj: args.inputFileObj,\n    outputNumber: 1,\n    variables: args.variables,\n  };\n};\n"
      },
      "id": "CTitle01",
